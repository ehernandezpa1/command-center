<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Command Center</title>
<style>
:root{--bg:#eef0f5;--surface:#fff;--ink:#1d2230;--mute:#667086;--line:#d9dde8;--accent:#4a3fd1;--accent-ink:#fff;--soft:#e6e4fb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161e;--surface:#1d2030;--ink:#eceef6;--mute:#9aa2b8;--line:#2c3045;--accent:#8f86ff;--accent-ink:#14161e;--soft:#292650}}
:root[data-theme="dark"]{--bg:#14161e;--surface:#1d2030;--ink:#eceef6;--mute:#9aa2b8;--line:#2c3045;--accent:#8f86ff;--accent-ink:#14161e;--soft:#292650}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
.app{max-width:1060px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:15px;font-weight:600;margin:0 0 10px;color:var(--mute)}
h3{font-size:20px;margin:0;font-weight:700}
input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
input:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.ghost{border:0;background:none;color:var(--mute);padding:0 4px}
.row{display:flex;gap:8px;margin-top:10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.empty{color:var(--mute);font-size:14px;padding:2px}
.act{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.act input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex:none}
.act span{flex:1;min-width:0;overflow-wrap:anywhere}.act.done span{text-decoration:line-through;color:var(--mute)}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;min-width:0}
.tray{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 8px}
.chip{display:flex;align-items:center;gap:4px;background:var(--bg);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:4px 8px;font-size:13px;cursor:grab;user-select:none}
.chip.pick{padding:6px 10px}
.chip.armed{outline:2px solid var(--accent);background:var(--soft)}
.chip span{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0;overflow-wrap:anywhere;cursor:pointer}
.tk{font-size:11px;color:var(--mute);line-height:1.3}.tk.done{text-decoration:line-through}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:10px}
.wd{font-size:12px;color:var(--mute);text-align:center;padding:4px 0}
.day{min-height:92px;border:1px solid var(--line);border-radius:8px;padding:4px;display:flex;flex-direction:column;gap:4px}
.day.blank{border:0}
.day.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.day.over{background:var(--soft)}
.dn{font-size:12px;color:var(--mute)}
dialog{border:0;border-radius:16px;padding:24px;max-width:480px;width:calc(100% - 32px);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(10,12,20,.55)}
.warn{color:#c0392b;font-size:14px;margin-top:10px}
@media(max-width:600px){.day{min-height:64px;padding:2px}.chip{font-size:11px;padding:2px 4px}.chip.pick{font-size:13px;padding:6px 10px}.cal{padding:12px}}
textarea,input[type=date]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical}
textarea:focus,input[type=date]:focus{outline:2px solid var(--accent);outline-offset:1px}
#cDay{width:auto}
.wk{grid-column:1/-1;display:flex;gap:8px;align-items:center;margin-bottom:6px}
.wk button{padding:2px 10px;font-size:13px}
.wnote{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.cal.over{background:var(--soft)}
.stash{display:flex;flex-wrap:wrap;gap:8px}
.sc{align-items:flex-start;min-width:150px;max-width:230px;padding:8px 10px}
#ndlg{max-width:620px}
.tb{display:flex;flex-wrap:wrap;gap:4px;margin-top:12px;padding:6px;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.tb button{padding:4px 9px;font-size:14px;min-width:34px}
.tb select{font:inherit;font-size:14px;padding:4px 6px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
#nText{min-height:200px;max-height:50vh;overflow:auto;margin-top:8px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
#nText:empty:before{content:attr(data-ph);color:var(--mute)}
#nText:focus{outline:2px solid var(--accent);outline-offset:1px}
#nText h2{font-size:20px;margin:.3em 0}
#nText h3{font-size:17px;margin:.3em 0}
#nText ul,#nText ol{margin:.3em 0;padding-left:1.4em}
#nText .ck.done{text-decoration:line-through;color:var(--mute)}
#nText input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);vertical-align:middle}
.day.other{background:var(--bg)}
.day.other .chip{background:var(--surface)}
.day.wkhl{background:var(--soft);border-color:var(--accent)}
#nWeeks{margin-top:18px}
.wlog{border-top:1px solid var(--line);padding:10px 0}
.wlog b{font-size:14px}
#nWeeks .ck.done{text-decoration:line-through;color:var(--mute)}
#nWeeks input[type=checkbox]{pointer-events:none;accent-color:var(--accent)}
#nWeeks h2{font-size:18px;margin:.3em 0}
#nWeeks h3.sub{font-size:16px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{border-radius:99px;padding:6px 18px}
.tabs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:14px;align-items:start}
.tl{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px}
.ch2{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.ch2 b{flex:1;font-size:17px;min-width:0;overflow-wrap:anywhere}
.ch2 small{color:var(--mute)}
.shelf{display:flex;align-items:flex-end;gap:12px;overflow-x:auto;padding:22px 10px 0}
.pad{position:relative;flex:none;width:118px;border:0;border-radius:3px 8px 8px 3px;background:var(--pc);color:#fff;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;padding:32px 8px 14px;box-shadow:inset -5px 0 0 rgba(0,0,0,.18),0 2px 4px rgba(0,0,0,.25);cursor:pointer;transition:transform .15s}
.pad:hover{transform:translateY(-6px)}
.pad::before{content:"";position:absolute;top:0;left:0;right:0;height:22px;background:rgba(0,0,0,.28);border-radius:3px 8px 0 0}
.plabel{background:#fffef5;color:#2b2b2b;border-radius:3px;padding:6px 8px;font-size:14px;font-weight:600;width:100%;text-align:center;overflow-wrap:anywhere}
.pad small{opacity:.92}
.newpad{background:transparent;border:2px dashed var(--line);color:var(--mute);font-size:32px;box-shadow:none;height:150px;justify-content:center;padding:0}
.newpad::before{display:none}
.plank{height:16px;border-radius:3px;background:linear-gradient(#b07d52,#7a4f2e);box-shadow:0 6px 10px rgba(0,0,0,.25)}
.paperpad{max-width:720px;margin:14px auto 0}
.padtop{height:28px;border-radius:8px 8px 0 0;background:radial-gradient(circle at 16px 50%,#fffef5 5px,transparent 6px) 0 0/32px 100%,var(--pc)}
.sheet{background:#fffef5;color:#2b2b2b;border:1px solid #d8d3bd;border-top:0;box-shadow:0 8px 16px rgba(0,0,0,.2),0 2px 0 #e9e4cf,0 4px 0 #f3efdc}
.sheet.anim{animation:turn .25s ease-out}
@keyframes turn{from{transform:translateY(-10px);opacity:.3}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.sheet.anim{animation:none}.pad{transition:none}}
.stitle{padding:10px 18px 0 56px;font-weight:700;color:#7a7461;font-size:14px}
textarea.lined{display:block;width:100%;min-height:420px;border:0;border-radius:0;color:#2b2b2b;font:17px/28px "Segoe Print","Bradley Hand",Noteworthy,system-ui,sans-serif;padding:0 18px 0 56px;resize:none;background-color:transparent;background-image:linear-gradient(90deg,transparent 44px,#e8a0a0 44px,#e8a0a0 45px,transparent 45px),repeating-linear-gradient(transparent,transparent 27px,#c9d6e8 27px,#c9d6e8 28px);background-attachment:local}
textarea.lined:focus{outline:none}
.pfoot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px;justify-content:center}
.pfoot button:disabled{opacity:.4;cursor:default}
.shelf{overflow:visible;min-height:200px}
.plank{margin-bottom:8px}
div.lined{min-height:420px;color:#2b2b2b;font:17px/28px "Segoe Print","Bradley Hand",Noteworthy,system-ui,sans-serif;padding:0 18px 0 56px;outline:none;overflow-wrap:anywhere;background-image:linear-gradient(90deg,transparent 44px,#e8a0a0 44px,#e8a0a0 45px,transparent 45px),repeating-linear-gradient(transparent,transparent 27px,#c9d6e8 27px,#c9d6e8 28px);background-attachment:local}
div.lined:empty:before{content:attr(data-ph);color:#a8a28a}
div.lined ul,div.lined ol{margin:0;padding-left:1.4em}
div.lined .ck.done{text-decoration:line-through;color:#8a8470}
div.lined input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);vertical-align:middle;margin:0 4px 0 0}
body[data-page="learning"] .chip{background:var(--bg);background:color-mix(in srgb,var(--c) 30%,var(--surface))}
body[data-page="learning"] .chip.armed{outline:2px solid var(--accent)}
body[data-page="projects"] .chip{color:#1b1f2a;border-color:rgba(0,0,0,.18);background:#d9dce3}
body[data-page="projects"] .chip .tk{color:#3a4152}
body[data-page="projects"] .chip .ghost{color:#3a4152}
body[data-page="projects"] .chip.armed{outline:2px solid var(--accent)}
.grid.focus .day{min-height:260px}
.grid.focus .chip{font-size:15px}
.grid.focus .tk{font-size:13px}
@media(max-width:600px){.grid.focus{grid-template-columns:1fr}.grid.focus .wd{display:none}.grid.focus .day{min-height:90px}.grid.focus .chip{font-size:14px;padding:6px 8px}}
.chip{transition:transform .12s,box-shadow .12s}
.day .chip:hover,.sc:hover,.chip.pick:hover{transform:scale(1.07);position:relative;z-index:3;box-shadow:0 4px 12px rgba(0,0,0,.25)}
@media(prefers-reduced-motion:reduce){.chip{transition:none}}
.pop{position:fixed;z-index:50;min-width:190px;max-width:290px;padding:10px 14px;border-radius:10px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-left:6px solid var(--accent);box-shadow:0 10px 28px rgba(0,0,0,.3);font-size:15px;line-height:1.45;pointer-events:none}
.pop b{font-size:16px}
.pop .pd{color:var(--mute);font-size:13px}
.pop .pt{margin-top:3px;overflow-wrap:anywhere}
.pop .pt.done{text-decoration:line-through;color:var(--mute)}
.day{container-type:inline-size;--ov:30px}
.chip span{overflow-wrap:break-word;hyphens:auto}
.chip b{line-height:1.2}
.grid.focus .chip b{font-size:15px!important}
@media(max-width:600px){.day{--ov:14px}.day .chip span{overflow-wrap:anywhere}}
.tabs.sub{margin:10px 0 4px}
.tabs.sub button{padding:4px 14px;font-size:14px}
.lg{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:var(--bg)}
.lgh{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.lgh b{flex:1;min-width:0}
.lgh small{color:var(--mute)}
.lgh button{padding:2px 12px;font-size:13px}
.lgb ul,.lgb ol{margin:.3em 0;padding-left:1.4em}
.lgb .ck.done{text-decoration:line-through;color:var(--mute)}
.lgb input[type=checkbox]{pointer-events:none;accent-color:var(--accent)}
.lgb h2{font-size:18px}
.lgb h3{font-size:16px}
.spine{position:relative;flex:none;border:0;border-radius:2px 4px 4px 2px;background:var(--pc);color:#fff;padding:10px 4px;box-shadow:inset 4px 0 0 rgba(0,0,0,.25),inset -2px 0 0 rgba(255,255,255,.12),0 2px 4px rgba(0,0,0,.3);cursor:pointer;transition:transform .15s;display:flex;align-items:center;justify-content:center}
.spine:hover{transform:translateY(-6px)}
.spine span{writing-mode:vertical-rl;font-size:13px;font-weight:600;max-height:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spine.m::before,.spine.m::after{content:"";position:absolute;left:0;right:0;height:5px;background:rgba(255,215,120,.85)}
.spine.m::before{top:12px}
.spine.m::after{bottom:12px}
.pad.book{border-radius:2px 6px 6px 2px;box-shadow:inset 8px 0 0 rgba(0,0,0,.28),inset 11px 0 0 rgba(255,255,255,.12),0 2px 5px rgba(0,0,0,.35)}
.pad.book::before{left:0;right:0;top:0;bottom:0;height:auto;background:none;border-top:7px solid rgba(255,215,120,.8);border-bottom:7px solid rgba(255,215,120,.8);border-radius:0}
div.lined[contenteditable="false"] input[type=checkbox]{pointer-events:none}
.ann{margin-top:16px;padding:12px 14px;background:#fff8c9;color:#2b2b2b;border-radius:6px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.note{display:flex;gap:8px;padding:6px 0;border-bottom:1px dashed #d9cf8c}
.note span{flex:1;overflow-wrap:anywhere}
.ann .ghost{color:#7a7461}
.ann input[type=text]{background:#fffdf0;color:#2b2b2b;border-color:#d9cf8c}
[hidden]{display:none!important}
.spine.hl{outline:3px solid var(--accent);outline-offset:3px;animation:glow 1.2s ease-in-out 4}
@keyframes glow{50%{box-shadow:0 0 14px 4px var(--accent)}}
@media(prefers-reduced-motion:reduce){.spine.hl{animation:none}}
.newtag{position:absolute;top:-14px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);font:700 10px/1 system-ui,sans-serif;padding:3px 7px;border-radius:99px;font-style:normal;writing-mode:horizontal-tb}
.prevbox{max-height:48vh;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:6px;background:var(--bg)}
.prevbox .prev{zoom:.6}
.prevbox .spine{pointer-events:none}
.chip.flash{outline:3px solid var(--accent);outline-offset:2px;animation:glow 1s ease-in-out 4}
@media(prefers-reduced-motion:reduce){.chip.flash{animation:none}}
.sw{position:relative;display:inline-grid;grid-template-columns:1fr 1fr;align-items:stretch;border:1px solid var(--line);border-radius:99px;background:var(--bg);padding:2px}
.sw::before{content:"";position:absolute;top:2px;bottom:2px;left:2px;width:calc(50% - 2px);border-radius:99px;background:var(--accent);transition:transform .2s ease}
.sw[data-on="1"]::before{transform:translateX(100%)}
.sw[data-off="1"]::before{opacity:0}
.tabs .sw button{position:relative;z-index:1;background:transparent;border:0;color:var(--ink);padding:6px 18px;border-radius:99px}
.tabs .sw button.on{background:transparent;color:var(--accent-ink)}
.tabs.sub .sw button{padding:4px 14px}
@media(prefers-reduced-motion:reduce){.sw::before{transition:none}}
.kbar{display:flex;flex-wrap:wrap;gap:6px}
.kbar button{border-radius:99px;padding:6px 16px}
.kbar .kb.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.cork{position:relative;margin-top:12px;padding:22px 14px 16px;border:10px solid #8b5e3c;border-radius:10px;background-color:#c9a679;background-image:radial-gradient(rgba(0,0,0,.13) 1px,transparent 1.6px),radial-gradient(rgba(255,255,255,.16) 1px,transparent 1.6px);background-size:9px 9px,13px 13px;background-position:0 0,4px 5px;box-shadow:inset 0 0 18px rgba(0,0,0,.35)}
.goals{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.pinbtn{display:flex;flex-direction:column;align-items:center;gap:6px;background:rgba(255,255,255,.35);border:2px dashed #7a4f2e;border-radius:12px;color:#3a2a18;font-weight:700;padding:12px 14px;cursor:pointer}
.pin{display:inline-block;position:relative;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff9a9a,#d62828 55%,#8f1414);box-shadow:0 3px 4px rgba(0,0,0,.45)}
.pin.big{width:34px;height:34px}
.pin.sm{position:absolute;top:-9px;left:50%;transform:translateX(-50%)}
.goal{position:relative;width:170px;background:#fff59d;color:#2b2b2b;padding:18px 12px 10px;border-radius:3px;box-shadow:0 4px 8px rgba(0,0,0,.35);transform:rotate(var(--r,0deg))}
.goal .gl{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.goal input{width:18px;height:18px;accent-color:#2b2b2b;flex:none;margin-top:2px}
.goal span{flex:1;overflow-wrap:anywhere}
.goal.done span{text-decoration:line-through;opacity:.6}
.gempty{color:#3a2a18;align-self:center;font-weight:600}
.kcols{display:flex;gap:12px;overflow-x:auto;margin-top:22px;align-items:flex-start;padding-bottom:6px}
.kcol{flex:none;width:250px;background:rgba(255,255,255,.9);color:#1d2230;border-radius:10px;padding:10px;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.kcol.over{outline:3px solid var(--accent)}
.kch{display:flex;align-items:center;gap:8px}
.kch b{flex:1;min-width:0;overflow-wrap:anywhere}
.kch small{color:#667086}
.kcol .ghost{color:#667086}
.kcard{display:flex;gap:2px;align-items:flex-start;background:#fff;border:1px solid #d9dde8;border-radius:8px;padding:8px;margin-top:8px;cursor:grab}
.kcard span{flex:1;min-width:0;overflow-wrap:anywhere;cursor:pointer}
.kcard .ghost:disabled{opacity:.25;cursor:default}
.kaddcol{flex:none;align-self:flex-start;background:rgba(255,255,255,.6);border:2px dashed #7a4f2e;color:#3a2a18;font-weight:700}
.kcol input[type=text]{background:#fff;color:#1d2230}
.cork{display:flex;flex-direction:column;height:520px;padding:8px 10px 10px}
.cork[data-size="s"]{height:340px}
.cork[data-size="l"]{height:820px}
.cork.full{position:fixed;inset:0;height:auto;z-index:60;margin:0;border-radius:0;padding-top:calc(env(safe-area-inset-top,0px) + 8px)}
.kstage{position:relative;flex:1;min-height:0}
.kscroll{position:absolute;inset:0;overflow:auto;padding:4px}
.kscroll .kcols{margin-top:0;overflow:visible;padding-bottom:6px;min-width:min-content}
.ktb{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:4px 2px 10px;flex:none}
.ktb button{background:rgba(255,255,255,.88);color:#1d2230;border:1px solid rgba(0,0,0,.25);display:inline-flex;align-items:center;gap:6px}
.ksz{display:inline-flex;border-radius:10px;overflow:hidden;border:1px solid rgba(0,0,0,.25)}
.ksz button{border:0;border-radius:0;padding:6px 14px}
.ksz button.on{background:var(--accent);color:var(--accent-ink)}
.pinned{position:absolute;z-index:5;width:150px;background:#fff59d;color:#2b2b2b;padding:20px 10px 8px;border-radius:3px;box-shadow:0 4px 8px rgba(0,0,0,.35);transform:rotate(var(--r,0deg));cursor:grab;touch-action:none;user-select:none}
.pinned.drag{cursor:grabbing;box-shadow:0 10px 18px rgba(0,0,0,.45);z-index:9}
.pinned .gl{display:flex;gap:8px;align-items:flex-start}
.pinned input{width:18px;height:18px;accent-color:#2b2b2b;flex:none;margin-top:2px}
.pinned span{flex:1;overflow-wrap:anywhere}
.pinned.done span{text-decoration:line-through;opacity:.6}
.board{display:flex;flex-direction:column;height:520px;margin-top:12px;padding:8px 10px 10px;background:#fff;color:#1d2230;border:1px solid #d9dde8;border-radius:14px}
.board[data-size="s"]{height:340px}
.board[data-size="l"]{height:820px}
.board.full{position:fixed;inset:0;height:auto;z-index:60;margin:0;border-radius:0;border:0;padding-top:calc(env(safe-area-inset-top,0px) + 8px)}
.kstr{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4;overflow:visible}
.kstr .shit{stroke:transparent;stroke-width:16;fill:none;pointer-events:stroke;cursor:pointer}
.kstr .sline{stroke:#c0392b;stroke-width:3;fill:none;stroke-linecap:round}
.ktb button.on{background:#c0392b;color:#fff;border-color:#c0392b}
.khint{background:#fdecea;color:#7b241c;border-radius:8px;padding:6px 10px;margin:0 2px 8px;font-size:14px;flex:none}
.pinned.sel{outline:3px solid #c0392b}
.pinned{width:140px;background:#fff;border:1px solid #cfd4df;border-radius:10px;padding:12px 10px 8px;box-shadow:none;transform:none;font-size:14px;line-height:1.3}
.pinned.drag{box-shadow:0 6px 14px rgba(0,0,0,.2)}
.pinned .pin.sm{top:-5px;width:10px;height:10px;box-shadow:none}
.pinned .gl{gap:6px}
.pinned input{width:15px;height:15px;margin-top:1px}
.pinned.done span{opacity:.5}
.kstr{z-index:10}
.kheads{position:absolute;inset:0;pointer-events:none;z-index:11}
.kheads .pin.hd{position:absolute;width:10px;height:10px;box-shadow:none}
.pinned .pin.sm{display:none}
.arrow{position:absolute;z-index:5;width:120px;height:30px;transform:rotate(var(--ar,0deg));touch-action:none;cursor:grab;user-select:none}
.arrow svg{display:block;pointer-events:none}
.arrow.sel{outline:2px dashed var(--accent);outline-offset:4px;border-radius:4px}
.arrow .ah,.arrow .ad{display:none;position:absolute;padding:0;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.arrow .ah{right:-12px;top:50%;width:24px;height:24px;margin-top:-12px;border-radius:50%;background:var(--accent);cursor:grab;touch-action:none}
.arrow .ad{left:-14px;top:-14px;width:24px;height:24px;border-radius:50%;background:#c0392b;color:#fff;line-height:1;font-size:16px}
.arrow.sel .ah,.arrow.sel .ad{display:block}
.arrow{display:flex;align-items:center}
.arrow .as{flex:1;height:6px;background:#1d2230;border-radius:3px}
.arrow .ahd{width:0;height:0;border-left:26px solid #1d2230;border-top:12px solid transparent;border-bottom:12px solid transparent;margin-left:-2px}
.arrow .arh,.arrow .ash{display:none;position:absolute;padding:0;box-shadow:0 1px 4px rgba(0,0,0,.4);touch-action:none}
.arrow .arh{left:50%;top:-40px;margin-left:-12px;width:24px;height:24px;border-radius:50%;background:var(--accent);border:2px solid #fff;cursor:grab}
.arrow .ash{right:-16px;top:50%;margin-top:-10px;width:20px;height:20px;border-radius:4px;background:#fff;border:2px solid var(--accent);cursor:ew-resize}
.arrow.sel .arh,.arrow.sel .ash{display:block}
.pinned.tsel,.arrow.tsel{outline:3px solid #c0392b;outline-offset:3px}
.pinned{padding-top:22px}
.kheads .hd{position:absolute;line-height:0}
.kstr .sline.g{stroke:#27ae60}
.kstr .sline{stroke:#7f8898}
</style>
</head>
<body>
<div class="app">
  <div class="top" style="align-items:flex-start"><div class="tabs" id="tabs" role="tablist" style="flex:1;min-width:0"></div><button id="bkBtn" title="Back up or restore your data">Backup</button></div>
  <section class="cal" id="cal"></section>
  <section class="cal" id="store" style="margin-top:16px"></section>
  <section class="cal" id="todo" hidden></section>
  <section class="cal" id="shelf" hidden></section>
  <section class="cal" id="boards" hidden></section>
</div>

<dialog id="edlg">
  <h2 style="margin:0 0 6px;font-size:22px">Added to your Logs</h2>
  <div class="empty" id="edMsg" style="margin-bottom:10px"></div>
  <div class="prevbox"><div class="prev" id="edPrev"></div></div>
  <div class="row" style="justify-content:flex-end;margin-top:16px"><button id="edClose">Stay here</button><button class="primary" id="edGo">Open Logs tab</button></div>
</dialog>

<dialog id="xdlg">
  <h2 id="xTitle" style="margin:0 0 12px;font-size:22px"></h2>
  <textarea id="xText" rows="3" aria-label="Text"></textarea>
  <div class="row" id="xCols" hidden style="flex-wrap:wrap;margin:12px 0 0"></div>
  <div class="warn" id="xWarn" hidden></div>
  <div class="row" style="justify-content:space-between;margin-top:18px">
    <button id="xDel">Delete</button>
    <div class="row" style="margin:0"><button id="xCancel">Cancel</button><button class="primary" id="xOk">Save</button></div>
  </div>
</dialog>

<dialog id="bdlg">
  <h2 style="margin:0 0 8px;font-size:22px">Backup and restore</h2>
  <div class="empty" style="margin-bottom:8px">Your data is saved on this device automatically. To keep a safe copy or move it to another device, copy the backup text below. To restore, paste a backup into the box and press Restore.</div>
  <textarea id="bkText" rows="8" style="font-size:12px" aria-label="Backup data"></textarea>
  <div class="warn" id="bkMsg" hidden></div>
  <div class="row" style="justify-content:space-between;margin-top:14px"><button id="bkCopy">Copy backup</button><div class="row" style="margin:0"><button id="bkClose">Close</button><button class="primary" id="bkRestore">Restore from text</button></div></div>
</dialog>

<dialog id="pdlg">
  <h2 id="pdTitle" style="margin:0 0 12px;font-size:22px"></h2>
  <label for="pdName" style="font-size:14px;color:var(--mute)">Pad name</label>
  <input type="text" id="pdName" style="margin:6px 0 12px">
  <div class="row" id="pdCols" style="flex-wrap:wrap;margin:0"></div>
  <div class="warn" id="pdWarn" hidden></div>
  <div class="row" style="justify-content:space-between;margin-top:18px">
    <button id="pdDel">Delete pad</button>
    <div class="row" style="margin:0"><button id="pdCancel">Cancel</button><button class="primary" id="pdSave">Save</button></div>
  </div>
</dialog>

<dialog id="tdlg">
  <h2 id="tdTitle" style="margin:0 0 12px;font-size:22px"></h2>
  <label for="tdName" style="font-size:14px;color:var(--mute)">List name</label>
  <input type="text" id="tdName" style="margin-top:6px">
  <div class="warn" id="tdWarn" hidden></div>
  <div class="row" style="justify-content:space-between;margin-top:18px">
    <button id="tdDel">Delete list</button>
    <div class="row" style="margin:0"><button id="tdCancel">Cancel</button><button class="primary" id="tdSave">Save</button></div>
  </div>
</dialog>

<dialog id="mdlg">
  <h2 id="mTitle" style="margin:0 0 12px;font-size:22px">Edit project</h2>
  <label for="mName" style="font-size:14px;color:var(--mute)">Name</label>
  <input type="text" id="mName" style="margin-top:6px">
  <div class="warn" id="mWarn" hidden></div>
  <div class="row" style="justify-content:space-between;margin-top:18px">
    <button id="mDel">Delete project</button>
    <div class="row" style="margin:0"><button id="mCancel">Cancel</button><button class="primary" id="mSave">Save</button></div>
  </div>
</dialog>

<dialog id="ndlg">
  <h2 id="nTitle" style="margin:0;font-size:22px"></h2>
  <div class="tb" id="nTb" role="toolbar" aria-label="Formatting">
    <select id="nBlock" aria-label="Text style"><option value="p">Normal</option><option value="h2">Heading</option><option value="h3">Subheading</option></select>
    <button data-c="bold" title="Bold" aria-label="Bold"><b>B</b></button>
    <button data-c="italic" title="Italic" aria-label="Italic"><i>I</i></button>
    <button data-c="underline" title="Underline" aria-label="Underline"><u>U</u></button>
    <button data-c="strikeThrough" title="Strikethrough" aria-label="Strikethrough"><s>S</s></button>
    <button data-c="hl" title="Highlight">Highlight</button>
    <button data-c="insertUnorderedList" title="Bulleted list">&bull; List</button>
    <button data-c="insertOrderedList" title="Numbered list">1. List</button>
    <button id="nCheck" title="Checklist item">&#9744; To do</button>
    <button data-c="undo" title="Undo">Undo</button>
    <button data-c="redo" title="Redo">Redo</button>
    <button data-c="removeFormat" title="Clear formatting">Clear</button>
  </div>
  <div id="nText" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Log" data-ph="Log for this week"></div>
  <div class="row" id="nExpRow" hidden style="justify-content:space-between;align-items:center;flex-wrap:wrap"><span class="empty" id="nExpMsg"></span><span class="row" style="margin:0"><button id="nGoLogs">Go to Logs</button><button id="nExport">Export as book</button></span></div>
  <div id="nWeeks" hidden></div>
  <div class="row" style="justify-content:flex-end;margin-top:16px"><button class="primary" id="nDone">Done</button></div>
</dialog>

<dialog id="adlg">
  <h2 id="aTitle" style="margin:0 0 12px;font-size:22px">New project</h2>
  <label for="aName" style="font-size:14px;color:var(--mute)">Enter name</label>
  <input type="text" id="aName" style="margin-top:6px">
  <div class="row" style="justify-content:flex-end;margin-top:18px"><button id="aCancel">Cancel</button><button class="primary" id="aAdd">Add project</button></div>
</dialog>

<dialog id="cdlg">
  <div class="top"><h2 id="cTitle" style="margin:0;font-size:22px"></h2><button class="ghost" id="cClose" aria-label="Close">&times;</button></div>
  <div class="row" style="margin:0 0 8px;align-items:center;flex-wrap:wrap"><input type="date" id="cDay" aria-label="Day"><button id="cStore">Move to storage</button><button id="cDup">Duplicate</button></div>
  <div id="cTasks"></div>
  <div class="empty" id="cLogMsg" style="margin-top:6px"></div>
  <div class="row"><input type="text" id="cNew" placeholder="Add a task for this day"><button id="cAdd">Add</button></div>
  <div class="row" style="justify-content:flex-end;margin-top:16px"><button class="primary" id="cDone">Done</button></div>
</dialog>

<script>
const KEYS={projects:"project-desk-v1",learning:"project-desk-learning-v1"};
const SEEDS={projects:["Manhwa","Illustration","Songwriting","Worldbuilding","3D sculpting","Music production","Guitar covers","Vlogging","Game development"],learning:["Music theory","Drawing fundamentals","3D modeling","Game design","Storytelling","Guitar technique"]};
let mode="cal";let page="projects";try{const pv=localStorage.getItem("project-desk-page");if(pv==="learning")page="learning";if(pv==="shelf"||pv==="boards")mode=pv}catch(e){}
let KEY=KEYS[page];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nid=()=>Math.random().toString(36).slice(2,9);
function safeLoad(k,ok){let raw=null;try{raw=localStorage.getItem(k)}catch(e){return null}
  if(raw===null)return null;
  let o;try{o=JSON.parse(raw)}catch(e){o=undefined}
  if(o!==undefined&&(!ok||ok(o)))return o;
  try{if(localStorage.getItem(k+"-corrupt")===null)localStorage.setItem(k+"-corrupt",raw)}catch(e2){}
  return null}
const DATA_VERSION=1,ALL_KEYS=["project-desk-v1","project-desk-learning-v1","project-desk-shelf-v1","project-desk-todo-v1","project-desk-page","project-desk-boards-v1"];
(function(){let v=0;try{v=+localStorage.getItem("project-desk-schema")||0}catch(e){}
  if(v>=DATA_VERSION)return;
  try{if(v>0){const snap={};ALL_KEYS.forEach(k=>{const x=localStorage.getItem(k);if(x!==null)snap[k]=x});localStorage.setItem("project-desk-prebackup-v"+v,JSON.stringify(snap))}
    /* future data upgrades go here, for example: if(v<2){...} */
    localStorage.setItem("project-desk-schema",String(DATA_VERSION))}catch(e){}})();
let S=safeLoad(KEY,o=>o&&Array.isArray(o.list));
if(!S||!Array.isArray(S.list))S={list:SEEDS[page].map(n=>({id:nid(),name:n})),cal:[]};
S.cal=S.cal||[];
S.list.forEach((p,i)=>{if(p.h===undefined)p.h=(i*47)%360});
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
let vm=new Date();vm.setDate(1);let armed=null,editing=null,curCard=null,delArmed=false;
const col=p=>`hsl(${p.h} 60% 55%);--c:hsl(${p.h} 60% 55%)`;

function render(){
  
  if(mode==="boards"){$("shelf").hidden=true;renderBoards();return}
  if(mode==="shelf"){$("boards").hidden=true;renderShelf();return}
  $("boards").hidden=true;
  $("shelf").hidden=true;
  $("todo").hidden=true;$("cal").hidden=false;$("store").hidden=false;
  const y=vm.getFullYear(),m=vm.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),today=ymd(new Date());
  let cells="";
  for(let i=first;i>0;i--)cells+=dayHtml(new Date(y,m,1-i),today,true);
  for(let d=1;d<=days;d++){const k=ymd(new Date(y,m,d));
    const es=S.cal.filter(e=>e.date===k).map(e=>{const p=S.list.find(x=>x.id===e.pid);if(!p)return"";const t=e.tasks||[];
      return `<div class="chip" draggable="true" data-e="${e.id}" style="border-left-color:${col(p)}"><span data-edit="${e.id}"><b>${esc(p.name)}</b>${t.slice(0,3).map(x=>`<small class="tk ${x.d?"done":""}">${esc(x.t)}</small>`).join("")||'<small class="tk">Tap to add tasks</small>'}${t.length>3?`<small class="tk">+${t.length-3} more</small>`:""}</span><button class="ghost" data-rm="${e.id}" aria-label="Remove from day">&times;</button></div>`}).join("");
    cells+=`<div class="day ${k===today?"today":""}" data-d="${k}" data-wkk="${ymd(new Date(y,m,d-new Date(y,m,d).getDay()))}"><div class="dn">${focusWeek?new Date(y,m,d).toLocaleDateString("default",{weekday:"short"})+" ":""}${d}</div>${dayCards(k)}</div>`;
    const dw=new Date(y,m,d).getDay();
    if(dw===6||d===days){for(let i=dw+1;i<=6;i++)cells+=dayHtml(new Date(y,m+1,i-dw),today,true);const wk=ymd(new Date(y,m,d-dw)),nt=plain((S.notes||{})[wk]||"").trim();cells+=`<div class="wk" data-wkk="${wk}"><button data-zw="${wk}" aria-pressed="${focusWeek===wk}" title="${focusWeek===wk?"Show the whole month":"Zoom in on this week"}">Week ${weekNo(wk)}${focusWeek===wk?" ✕":""}</button><button data-wn="${wk}">LOG${nt?" •":""}</button><span class="wnote">${esc(nt)}</span></div>`}}
  $("cal").innerHTML=`<div class="top"><h3>${vm.toLocaleString("default",{month:"long",year:"numeric"})}</h3><div class="row" style="margin:0"><button id="mlog">MONTH LOG${plain((S.notes||{})["m:"+y+"-"+String(m+1).padStart(2,"0")]||"").trim()?" •":""}</button><button id="pm" aria-label="Previous month">&lsaquo;</button><button id="nm" aria-label="Next month">&rsaquo;</button></div></div>
  <div class="tray">${S.list.map(p=>`<div class="chip pick ${armed===p.id?"armed":""}" draggable="true" data-p="${p.id}" style="border-left-color:${col(p)}"><span>${esc(p.name)}</span><button class="ghost" data-m="${p.id}" aria-label="Rename or delete ${esc(p.name)}">&#9998;</button></div>`).join("")||`<div class="empty">No ${noun()}s yet. Tap + to add one.</div>`}<button id="plus" aria-label="Add project" style="padding:4px 16px;font-size:20px;line-height:1.3">+</button></div>
  
  <div class="empty">Drag a ${noun()} onto a day, or tap a ${noun()}, then tap a day. Tap a card on the calendar to add tasks. Tap the pencil to rename or delete a ${noun()}.</div>
  <div class="grid${focusWeek?" focus":""}">${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(w=>`<div class="wd">${w}</div>`).join("")}${cells}</div>`;
  wire();renderStore();applyWords();
}
const noun=()=>page==="learning"?"topic":"project";
function switchPage(p){
  if(p==="boards"){mode="boards";try{localStorage.setItem("project-desk-page","boards")}catch(e){}render();return}
  if(p==="shelf"){mode="shelf";try{localStorage.setItem("project-desk-page","shelf")}catch(e){}render();return}
  
  if(p===page&&mode==="cal")return;
  if(mode!=="cal"&&p===page){mode="cal";try{localStorage.setItem("project-desk-page",p)}catch(e){}render();return}
  mode="cal";page=p;KEY=KEYS[p];try{localStorage.setItem("project-desk-page",p)}catch(e){}
  let s=safeLoad(KEY,o=>o&&Array.isArray(o.list));
  if(!s||!Array.isArray(s.list))s={list:SEEDS[p].map(n=>({id:nid(),name:n})),cal:[]};
  s.cal=s.cal||[];s.list.forEach((q,i)=>{if(q.h===undefined)q.h=(i*47)%360});
  S=s;armed=null;render()}
function applyWords(){const n=noun();$("aTitle").textContent="New "+n;$("aAdd").textContent="Add "+n;$("mTitle").textContent="Edit "+n;$("mDel").textContent="Delete "+n;document.title="Command Center";document.body.dataset.page=mode==="cal"?page:"";
  $("tabs").innerHTML=navHtml();const _navOld=["projects","learning","shelf"].map(p=>{const on=mode==="cal"?p===page:p===mode;return `<button role="tab" aria-selected="${on}" data-pg="${p}" class="${on?"on":""}">${p==="projects"?"Projects":p==="learning"?"Learning topics":"Shelf"}</button>`}).join("");
  $("tabs").querySelectorAll("[data-pg]").forEach(b=>b.onclick=()=>switchPage(b.dataset.pg))}
let focusWeek=null;
const weekNo=k=>{const s=new Date(k+"T00:00"),sat=new Date(s.getFullYear(),s.getMonth(),s.getDate()+6),j=new Date(sat.getFullYear(),0,1),doy=Math.round((sat-j)/864e5)+1;return Math.floor((doy-1+j.getDay())/7)+1};
const nameFit=n=>{const L=Math.max(4,...n.split(/\s+/).map(w=>w.length));return `font-size:12px;font-size:clamp(8px,calc((100cqw - var(--ov,30px))/${(L*0.62).toFixed(2)}),13px)`};
const dayCards=k=>S.cal.filter(e=>e.date===k).map(e=>{const p=S.list.find(x=>x.id===e.pid);if(!p)return"";const t=e.tasks||[],lim=focusWeek?99:3;return `<div class="chip" draggable="true" data-e="${e.id}" style="border-left-color:${col(p)}"><span data-edit="${e.id}"><b style="${nameFit(p.name)}">${esc(p.name)}</b>${t.slice(0,lim).map(x=>`<small class="tk ${x.d?"done":""}">${esc(x.t)}</small>`).join("")||'<small class="tk">Tap to add tasks</small>'}${t.length>lim?`<small class="tk">+${t.length-lim} more</small>`:""}</span><button class="ghost" data-rm="${e.id}" aria-label="Remove from day">&times;</button></div>`}).join("");
let T=safeLoad("project-desk-todo-v1",o=>o&&Array.isArray(o.lists));
if(!T||!Array.isArray(T.lists))T={lists:["Chores","Housework","Groceries"].map(n=>({id:nid(),name:n,items:[]}))};
const saveT=()=>{try{localStorage.setItem("project-desk-todo-v1",JSON.stringify(T))}catch(e){}};
let tEdit=null,tDelArmed=false;
function openList(id){tEdit=id?T.lists.find(l=>l.id===id):null;tDelArmed=false;$("tdTitle").textContent=tEdit?"Edit list":"New list";$("tdName").value=tEdit?tEdit.name:"";$("tdDel").hidden=!tEdit;$("tdDel").textContent="Delete list";$("tdWarn").hidden=true;$("tdSave").textContent=tEdit?"Save":"Add list";$("tdlg").showModal();$("tdName").focus()}
function saveList(){const v=$("tdName").value.trim();if(!v)return;if(tEdit)tEdit.name=v;else T.lists.push({id:nid(),name:v,items:[]});saveT();$("tdlg").close();renderTodo()}
$("tdSave").onclick=saveList;$("tdName").onkeydown=e=>{if(e.key==="Enter")saveList()};$("tdCancel").onclick=()=>$("tdlg").close();
$("tdDel").onclick=()=>{if(!tDelArmed){tDelArmed=true;$("tdDel").textContent="Tap again to delete";$("tdWarn").hidden=false;const n=tEdit.items.length;$("tdWarn").textContent=n?`This also removes ${n} item${n>1?"s":""}.`:"This can't be undone.";return}T.lists=T.lists.filter(l=>l!==tEdit);saveT();$("tdlg").close();renderTodo()};
function renderTodo(){
  $("cal").hidden=true;$("store").hidden=true;const box=$("todo");box.hidden=false;
  box.innerHTML=`<div class="top"><h3>To-do</h3><button id="tClear">Clear checked items</button></div>
  <div class="tgrid">${T.lists.map(l=>{const dn=l.items.filter(i=>i.d).length;return `<div class="tl"><div class="ch2"><b>${esc(l.name)}</b><small>${dn}/${l.items.length}</small><button class="ghost" data-lr="${l.id}" aria-label="Rename or delete ${esc(l.name)}">&#9998;</button></div><div>${l.items.map(i=>`<div class="act ${i.d?"done":""}"><input type="checkbox" data-ti="${l.id}:${i.id}" ${i.d?"checked":""} aria-label="Done"><span>${esc(i.t)}</span><button class="ghost" data-td="${l.id}:${i.id}" aria-label="Remove item">&times;</button></div>`).join("")||'<div class="empty">Nothing here yet.</div>'}</div><div class="row"><input type="text" data-tn="${l.id}" placeholder="Add item"><button data-ta="${l.id}">Add</button></div></div>`}).join("")}</div>
  <button id="tPlus" style="margin-top:14px">+ New list</button>`;
  $("tPlus").onclick=()=>openList(null);
  $("tClear").onclick=()=>{T.lists.forEach(l=>l.items=l.items.filter(i=>!i.d));saveT();renderTodo()};
  box.querySelectorAll("[data-lr]").forEach(b=>b.onclick=()=>openList(b.dataset.lr));
  box.querySelectorAll("[data-ti]").forEach(c=>c.onchange=()=>{const [l,i]=c.dataset.ti.split(":"),it=T.lists.find(x=>x.id===l).items.find(x=>x.id===i);it.d=c.checked;saveT();renderTodo()});
  box.querySelectorAll("[data-td]").forEach(b=>b.onclick=()=>{const [l,i]=b.dataset.td.split(":"),L=T.lists.find(x=>x.id===l);L.items=L.items.filter(x=>x.id!==i);saveT();renderTodo()});
  const addItem=id=>{const inp=box.querySelector(`[data-tn="${id}"]`),v=inp.value.trim();if(!v)return;T.lists.find(x=>x.id===id).items.push({id:nid(),t:v,d:false});saveT();renderTodo();const n=box.querySelector(`[data-tn="${id}"]`);if(n)n.focus()};
  box.querySelectorAll("[data-ta]").forEach(b=>b.onclick=()=>addItem(b.dataset.ta));
  box.querySelectorAll("[data-tn]").forEach(i=>i.onkeydown=e=>{if(e.key==="Enter")addItem(i.dataset.tn)});
  applyWords();

    drag(sh,ev=>{const c=centre(),r=(a.r||0)*Math.PI/180,proj=(ev.clientX-c.x)*Math.cos(r)+(ev.clientY-c.y)*Math.sin(r),len=Math.max(50,Math.min(700,Math.round(proj*2))),cx=el.offsetLeft+el.offsetWidth/2;el.style.width=len+"px";el.style.left=(cx-len/2)+"px";a.len=len;a.x=(cx-len/2)/c.w;drawStrings(box,b)});
    el.onpointerdown=e=>{if(e.target.closest(".arh,.ash,.ad"))return;
      const sr=stage.getBoundingClientRect(),w=el.offsetWidth,h=el.offsetHeight,x0=el.offsetLeft,y0=el.offsetTop,sx=e.clientX,sy=e.clientY;let moved=false;

        const x=Math.max(0,Math.min(x0+dx,sr.width-w)),y=Math.max(0,Math.min(y0+dy,sr.height-h));el.style.left=x+"px";el.style.top=y+"px";a.x=x/sr.width;a.y=y/sr.height;drawStrings(box,b)};
      const up=ev=>{el.removeEventListener("pointermove",mv);el.removeEventListener("pointerup",up);el.removeEventListener("pointercancel",up);saveK();if(!moved&&ev.type==="pointerup"){if(strMode)tie(b,a,el);else{selArrow=a.id===selArrow?null:a.id;renderBoards()}}};
      el.addEventListener("pointermove",mv);el.addEventListener("pointerup",up);el.addEventListener("pointercancel",up)}});

const LED_COLORS=[["Off (dead bulb)",null],["Red","#ff3b3b"],["Orange","#ff9f1a"],["Yellow","#ffd60a"],["Blue","#2e86ff"],["Purple","#a45bff"],["Pink","#ff5fa8"],["White","#ffffff"]];
let xColor=null;
function drawXCols(cs){const bx=$("xCols");bx.hidden=!cs;if(!cs){bx.innerHTML="";return}
  bx.innerHTML=`<div style="width:100%;font-size:14px;color:var(--mute)">Light color</div>`+cs.list.map(([n,col])=>{const on=(xColor||"")===(col||"");return `<button type="button" data-xc="${col||""}" aria-label="${n}" aria-pressed="${on}" title="${n}" style="width:36px;height:36px;padding:0;border-radius:50%;background:${col||"#e4e8ee"};border:3px solid ${on?"var(--ink)":"transparent"};font-size:11px;color:#5b6475">${col?"":"off"}</button>`}).join("");

function bulb(c,d){const col=d?"#2ecc71":c,base="";
  if(!col)return `<svg width="22" height="30" viewBox="0 0 22 30" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="#e4e8ee" fill-opacity=".85" stroke="#9aa3b2" stroke-width="1.5"/><path d="M8 17V13l1.5-2 1.5 2 1.5-2 1.5 2v4" fill="none" stroke="#6b7384" stroke-width="1" stroke-dasharray="2 1.5"/>${base}</svg>`;
  return `<svg width="22" height="30" viewBox="0 0 22 30" aria-hidden="true" style="filter:drop-shadow(0 0 5px ${col})"><circle cx="11" cy="11" r="9" fill="${col}" stroke="rgba(0,0,0,.35)" stroke-width="1.5"/><ellipse cx="8" cy="7.5" rx="3" ry="2" fill="#fff" fill-opacity=".55"/>${d?`<path d="M6.5 11.5l3 3 6-6.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>`:`<path d="M8 17V13l1.5-2 1.5 2 1.5-2 1.5 2v4" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="1.2"/>`}${base}</svg>`}
function drawStrings(box,b){const stage=$("kStage"),svg=stage&&stage.querySelector(".kstr"),hd=stage&&stage.querySelector(".kheads");if(!svg)return;
  const pos=id=>{const el=stage.querySelector(`[data-pn="${id}"],[data-an="${id}"]`);return el?{x:el.offsetLeft+el.offsetWidth/2,y:el.offsetTop+(el.dataset.an?el.offsetHeight/2:0)}:null};
  const dn=id=>!!(b.pins||[]).find(p=>p.id===id&&p.d);
  svg.innerHTML=(b.strings||[]).map(s=>{const A=pos(s.a),B=pos(s.b);if(!A||!B)return"";const M={x:(A.x+B.x)/2,y:(A.y+B.y)/2};
    return `<g data-sid="${s.id}"><path d="M${A.x},${A.y}L${B.x},${B.y}" class="shit"/><path d="M${A.x},${A.y}L${M.x},${M.y}" class="sline${dn(s.a)?" g":""}"/><path d="M${M.x},${M.y}L${B.x},${B.y}" class="sline${dn(s.b)?" g":""}"/></g>`}).join("");
  if(hd)hd.innerHTML=(b.pins||[]).concat(b.arrows||[]).map(p=>{const A=pos(p.id);return A?`<span class="hd" style="left:${A.x-11}px;top:${A.y-11}px">${bulb(p.c,p.d)}</span>`:""}).join("")}
function dayHtml(dt,today,other){const k=ymd(dt);
  const es=dayCards(k);
  const lbl=(focusWeek?dt.toLocaleDateString("default",{weekday:"short"})+" ":"")+(dt.getDate()===1?dt.toLocaleString("default",{month:"short"})+" 1":dt.getDate());
  return `<div class="day ${other?"other":""} ${k===today?"today":""}" data-d="${k}" data-wkk="${ymd(new Date(dt.getFullYear(),dt.getMonth(),dt.getDate()-dt.getDay()))}"><div class="dn">${lbl}</div>${es}</div>`}
function place(t,id,date){date=date||null;if(t==="p")S.cal.push({id:nid(),pid:id,date,tasks:[]});else{const e=S.cal.find(x=>x.id===id);if(e)e.date=date}armed=null;save();render()}
function renderStore(){
  const st=S.cal.filter(e=>!e.date&&S.list.find(p=>p.id===e.pid)),box=$("store");
  box.innerHTML=`<h3>Card storage</h3><div class="empty" style="margin:4px 0 10px">Drop a card here to store it with its tasks. Drag it back onto a day, or tap it and choose a day.</div><div class="stash">${st.map(e=>{const p=S.list.find(x=>x.id===e.pid),t=e.tasks||[];return `<div class="chip sc" draggable="true" data-e="${e.id}" style="border-left-color:${col(p)}"><span data-edit="${e.id}"><b>${esc(p.name)}</b>${t.slice(0,5).map(x=>`<small class="tk ${x.d?"done":""}">${esc(x.t)}</small>`).join("")||'<small class="tk">Tap to add tasks</small>'}${t.length>5?`<small class="tk">+${t.length-5} more</small>`:""}</span><button class="ghost" data-rm="${e.id}" aria-label="Delete card">&times;</button></div>`}).join("")||'<div class="empty">Nothing stored yet.</div>'}</div>`;
  box.ondragover=e=>{e.preventDefault();box.classList.add("over")};
  box.ondragleave=()=>box.classList.remove("over");
  box.ondrop=e=>{e.preventDefault();box.classList.remove("over");const [t,id]=e.dataTransfer.getData("text/plain").split(":");if(t&&id)place(t,id,null)};
  box.querySelectorAll("[data-e]").forEach(el=>el.ondragstart=e=>e.dataTransfer.setData("text/plain","e:"+el.dataset.e));
  box.querySelectorAll("[data-rm]").forEach(b=>b.onclick=e=>{e.stopPropagation();S.cal=S.cal.filter(x=>x.id!==b.dataset.rm);save();render()});

function wire(){

  c.querySelectorAll("[data-zw]").forEach(b=>{b.onclick=()=>{focusWeek=focusWeek===b.dataset.zw?null:b.dataset.zw;render()};const on=v=>c.querySelectorAll(`[data-wkk="${b.dataset.zw}"]`).forEach(d=>d.classList.toggle("wkhl",v));b.onmouseenter=()=>on(true);b.onmouseleave=()=>on(false);b.onfocus=()=>on(true);b.onblur=()=>on(false)});
  if(focusWeek)c.querySelectorAll(".day,.wk").forEach(el=>{if(el.dataset.wkk!==focusWeek)el.style.display="none"});
  $("mlog").onclick=()=>openNotes("m:"+vm.getFullYear()+"-"+String(vm.getMonth()+1).padStart(2,"0"));
  c.querySelectorAll("[data-wn]").forEach(b=>{b.onclick=()=>openNotes(b.dataset.wn);const on=v=>c.querySelectorAll(`[data-wkk="${b.dataset.wn}"]`).forEach(d=>d.classList.toggle("wkhl",v));b.onmouseenter=()=>on(true);b.onmouseleave=()=>on(false);b.onfocus=()=>on(true);b.onblur=()=>on(false)});
  $("nm").onclick=()=>{focusWeek=null;vm.setMonth(vm.getMonth()+1);render()};
  
  $("plus").onclick=()=>{$("aName").value="";$("adlg").showModal();$("aName").focus()};
  c.querySelectorAll("[data-p]").forEach(el=>{el.ondragstart=e=>e.dataTransfer.setData("text/plain","p:"+el.dataset.p);el.onclick=()=>{armed=armed===el.dataset.p?null:el.dataset.p;render()}});

  c.querySelectorAll("[data-e]").forEach(el=>el.ondragstart=e=>e.dataTransfer.setData("text/plain","e:"+el.dataset.e));

function openManage(id){editing=S.list.find(p=>p.id===id);delArmed=false;$("mName").value=editing.name;$("mWarn").hidden=true;$("mDel").textContent="Delete "+noun();$("mdlg").showModal();$("mName").select()}

};

function openCard(id){curCard=S.cal.find(x=>x.id===id);if(!curCard)return;const p=S.list.find(x=>x.id===curCard.pid);curCard.tasks=curCard.tasks||[];$("cTitle").textContent=p.name;$("cDay").value=curCard.date||"";$("cLogMsg").textContent="";drawCard();if(!$("cdlg").open)$("cdlg").showModal();$("cNew").focus()}

  box.innerHTML=c.tasks.map((x,i)=>`<div class="act ${x.d?"done":""}"><input type="checkbox" data-ci="${i}" ${x.d?"checked":""} aria-label="Done"><span>${esc(x.t)}</span><button class="ghost" data-cd="${i}" aria-label="Remove task">&times;</button></div>`).join("")||'<div class="empty">No tasks yet. Add what you will do on this day.</div>';

let wkKey=null;

  if(mo){const [yy,mm]=k.slice(2).split("-").map(Number);t.textContent="Log for "+new Date(yy,mm-1,1).toLocaleString("default",{month:"long",year:"numeric"})}
  else t.textContent=weekLabel(k)}
function showWeeks(k){const box=$("nWeeks");$("nExpRow").hidden=!k.startsWith("m:");$("nExpMsg").textContent="";
  if(!k.startsWith("m:")){box.hidden=true;box.innerHTML="";return}

function exportMonthOld(){
